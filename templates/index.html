<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manitto Checker (Secure)</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 2rem; text-align: center; }
    input, button { padding: 0.5rem; margin: 0.5rem; font-size: 1rem; }
    #result { margin-top: 2rem; font-size: 1.2rem; }
    .link-section { margin-top: 3rem; }
  </style>
</head>
<body>
  <h1>🎁 Discover Your Manitto!</h1>
  <form id="manittoForm">
    <input type="text" id="nameInput" placeholder="Enter your name" required />
    <input type="text" id="codeInput" placeholder="Enter your 4-digit code" required />
    <button type="submit">Reveal</button>
  </form>
  <div id="result"></div>

  <div class="link-section">
    <p><strong>📣 After completing your Manitto missions,<br>
    please share proof in our Kakao Open Chat!</strong></p>
    <p>
      👉 <a href="https://open.kakao.com/o/s2GBoguh" target="_blank">
        Join the Kakao Open Chat Room
      </a>
    </p>
  </div>

  <script>
    document.getElementById("manittoForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const name = document.getElementById("nameInput").value.trim();
      const code = document.getElementById("codeInput").value.trim();

      const res = await fetch("/get_manitto", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, code })
      });

      const data = await res.json();
      const resultEl = document.getElementById("result");

      if (data.manitto) {
        resultEl.innerHTML = `
          <p>Your Manitto is: <strong>${data.manitto}</strong></p>
          <p>Your missions are:</p>
          <ul>${data.missions.map(m => `<li>${m}</li>`).join('')}</ul>
        `;
      } else {
        resultEl.innerHTML = `<p style="color:red">${data.error}</p>`;
      }
    });
  </script>
</body>
</html>
