<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manitto Reveal</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 2rem; background: #f4f4f4; }
    input, button { padding: 0.6rem 1rem; margin: 0.5rem; font-size: 1rem; }
    #result { margin-top: 2rem; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h1>🎁 Find Out Your Manitto Mission</h1>
  <form id="manittoForm">
    <input type="text" id="nameInput" placeholder="Enter your name exactly" required />
    <button type="submit">Reveal</button>
  </form>
  <div id="result"></div>

  <script>
    document.getElementById("manittoForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const name = document.getElementById("nameInput").value.trim();
      const res = await fetch("/get_manitto", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });
      const data = await res.json();

      const resultEl = document.getElementById("result");
      if (data.manitto) {
        resultEl.innerHTML = `
          <p>Your Manitto is: <strong>${data.manitto}</strong></p>
          <p>Your missions are:</p>
          <ul>
            ${data.missions.map(m => `<li>${m}</li>`).join('')}
          </ul>
        `;
      } else {
        resultEl.innerHTML = `<p style="color: red;">${data.error}</p>`;
      }
    });
  </script>
</body>
</html>
